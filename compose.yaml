services:
  mongodb:
    image: mongo:8.0
    container_name: blockasset-mongodb
    restart: unless-stopped
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { rs.status().ok } catch (error) { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''mongodb:27017''}]}).ok }" | grep 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongodb_data: